  - id: center
    title: 活動拠点 | アーバンネイチャー北九州
    file: center/index.html
    page_type: archive
    cpt: center
    css:
      - https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap
      - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
      - css/base.css
      - css/page/center.css
    sections:
      - id: hero
        fields:
          - field_name: archive_hero_image
            type: image
            default: images/2025/03/biotope2.jpg
            alt: 響灘ビオトープの湿地
          - field_name: archive_title
            type: text
            default: 活動拠点
          - field_name: archive_lead
            type: textarea
            default: 北九州市が認定した10の自然体験・環境学習拠点
      - id: about
        fields:
          - field_name: about_title
            type: text
            default: 北九州ネイチャーポジティブセンターとは
          - field_name: about_body
            type: wysiwyg
            default: |-
              <p>北九州市生物多様性戦略 2025-2030 を推進する活動拠点として、市内10カ所の生物多様性関連公共施設を束ねた「北九州ネイチャーポジティブセンター（NPセンター）」を設置しました。</p>
                      <p>各施設はそれぞれ独自の特色を持ち、環境ミュージアムでの学習体験、響灘ビオトープでの自然観察、山田緑地での森林保全体験、到津の森公園での動物とのふれあい等、多様なプログラムを提供しています。</p>
                      <p>事務局はIGES北九州アーバンセンターが務め、各施設間の連携やイベントの共同企画、情報発信を行っています。10の拠点施設を巡ることで、北九州の豊かな自然環境を多角的に体験できます。</p>
      - id: list
        fields:
          - field_name: list_title
            type: text
            default: 拠点施設一覧
          - field_name: list_lead
            type: textarea
            default: 10のネイチャーポジティブセンター
      - id: map
        fields:
          - field_name: map_title
            type: text
            default: 拠点マップ
          - field_name: map_lead
            type: textarea
            default: 北九州市内10拠点の位置
      - id: office
        fields:
          - field_name: office_title
            type: text
            default: 事務局
          - field_name: office_lead
            type: textarea
            default: IGES 北九州アーバンセンター
          - field_name: office_image
            type: image
            default: images/2026/04/kitakyushu-urban-center.png
            alt: IGES 北九州アーバンセンタービル
          - field_name: office_body
            type: textarea
            default: アーバンネイチャー北九州の事務局は、公益財団法人 地球環境戦略研究機関（IGES）北九州アーバンセンターが務めています。
          - field_name: office_address
            type: wysiwyg
            default: 〒805-0062<br>福岡県北九州市八幡東区平野1-1-1<br>国際村交流センター3F
          - field_name: office_email
            type: text
            default: kitakyushu-info@iges.or.jp
          - field_name: office_access
            type: wysiwyg
            default: |-
              <strong>福岡空港から：</strong>地下鉄で博多駅（約5分）→ JR鹿児島線で八幡駅（約50分）→ 徒歩10分<br>
                            <strong>北九州空港から：</strong>西鉄バスで小倉駅（約40分）→ JR鹿児島線で八幡駅（約15分）→ 徒歩10分
