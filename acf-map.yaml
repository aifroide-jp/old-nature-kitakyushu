      - id: hero
        fields:
          - field_name: hero_image
            type: image
            default: images/2026/04/hiraodai.jpg
            alt: 青空と白い石灰岩が広がる平尾台の草原
          - field_name: event_status
            type: text
            default: ● 受付中
          - field_name: tag_1
            type: text
            default: '#ソラランド平尾台'
          - field_name: tag_2
            type: text
            default: '#親子向け'
          - field_name: tag_3
            type: text
            default: '#体験・遊び'
          - field_name: tag_4
            type: text
            default: '#無料'
          - field_name: hero_title
            type: text
            default: 平尾台シャボン玉フェスティバル
          - field_name: event_date
            type: text
            default: "2026年5月3日(日)\_\_10:00〜15:00（受付 9:30〜）"
      - id: detail
        fields:
          - field_name: detail_title
            type: text
            default: イベント内容
          - field_name: detail_body_1
            type: textarea
            default: >-
              九州最大のカルスト台地・平尾台の広大な草原を舞台に、色とりどりのシャボン玉が空を彩る1日限りのフェスティバルを開催します。大きなシャボン玉をつくるワークショップや、子どもたちが自由に走り回れる芝生広場での遊びコーナーなど、家族みんなで楽しめるプログラムを用意しています。
          - field_name: detail_body_2
            type: textarea
            default: >-
              「自然のなかで思いきり遊ぶ」をテーマに、カルスト地形の解説ガイドウォークも同時開催。石灰岩の羊群原を歩きながら、普段は気づかない平尾台の生き物や地形の不思議を学べます。小さなお子さんから大人まで、自然の楽しさを全身で感じられる1日です。
          - field_name: schedule_title
            type: text
            default: タイムスケジュール
          - field_name: schedule_time_1
            type: text
            default: 9:30〜
          - field_name: schedule_desc_1
