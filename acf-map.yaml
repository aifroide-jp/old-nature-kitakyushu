  - id: news_site_renewal
    title: アーバンネイチャー北九州のサイトをリニューアルしました | お知らせ | アーバンネイチャー北九州
    file: news/site-renewal.html
    page_type: single
    cpt: news
    css:
      - https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap
      - css/base.css
      - css/page/news.css
    sections:
      - id: article
        fields:
          - field_name: news_category
            type: text
            default: お知らせ
          - field_name: hero_title
            type: text
            default: アーバンネイチャー北九州のサイトをリニューアルしました
          - field_name: news_date
            type: text
            default: 2026年4月18日
          - field_name: article_body
            type: wysiwyg
            default:
              __php: |-
                '<p>平素よりアーバンネイチャー北九州をご利用いただき、誠にありがとうございます。このたび、ウェブサイトを全面的にリニューアルいたしました。</p>

                            <h2>リニューアルの背景</h2>
                            <p>北九州市の豊かな自然資源や、市民・企業・行政が連携したネイチャーポジティブの取り組みを、より多くの方にわかりやすくお届けしたいという思いから、サイトデザインと情報構成を一新しました。</p>

                            <h2>主な変更点</h2>
                            <ul>
                              <li><strong>自然スポット詳細ページの新設</strong>：曽根干潟・平尾台・響灘ビオトープなど、北九州市内9か所の自然スポットを写真・地図・アクセス情報とともにご紹介します。</li>
                              <li><strong>イベント情報の充実</strong>：参加申し込みフォームを各イベントページに設置しました。開催日・定員・参加費などをひと目で確認できます。</li>
                              <li><strong>活動拠点ページの整備</strong>：タカミヤ環境ミュージアム・いのちのたび博物館など、10施設の詳細ページをリニューアルしました。</li>
                              <li><strong>地域連携事例の追加</strong>：株式会社マインによる竹バイオマス循環モデルなど、企業との連携事例を紹介するページを新設しました。</li>
                              <li><strong>スマートフォン対応の強化</strong>：モバイル端末でも快適にご覧いただけるよう、レイアウトとナビゲーションを最適化しました。</li>
                            </ul>

                            <h2>今後について</h2>
                            <p>引き続きコンテンツの充実を図ってまいります。イベント情報・活動ブログ・写真素材など、北九州の自然に関する情報を随時更新していきます。</p>
                            <p>ご意見・ご要望は<a href="' . esc_url( nkk_get_page_permalink( 'contact' ) ) . '">お問合せフォーム</a>よりお気軽にお寄せください。引き続きアーバンネイチャー北九州をよろしくお願いいたします。</p>'
