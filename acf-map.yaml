    meta:
      title: 生物多様性とは？ | アーバンネイチャー北九州
      description: 生物多様性の重要性と北九州のアーバンネイチャー資源。生態系サービス、国内外の動向、地域の課題と豊かな自然を紹介。
  - id: about_spots
    title: 北九州市の自然スポット | アーバンネイチャー北九州
    file: about/spots.html
    page_type: archive
    cpt: spot
    css:
      - https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap
      - css/base.css
      - css/page/spot.css
    sections:
      - id: hero
        fields:
          - field_name: archive_hero_image
            type: image
            default: images/2025/03/genkai.jpg
            alt: 玄海国定公園の海岸線
          - field_name: archive_title
            type: text
            default: 北九州市の自然スポット
          - field_name: archive_lead
            type: textarea
            default: 都市から近い距離に広がる、多彩な自然資源
      - id: resources
        fields:
          - field_name: resources_title
            type: text
            default: 北九州のアーバンネイチャー資源
          - field_name: resources_lead
            type: textarea
            default: 北九州市には、都市部から近い距離に多彩な自然環境が広がっています。これらは市民に身近でありながら、国際的にも評価される貴重な自然資源です。
          - field_name: info_title
            type: text
            default: 北九州の自然は「身近さ」が最大の価値
          - field_name: info_body
            type: textarea
            default: >-
              これらの自然資源は、市街地から短時間でアクセスできることが最大の特徴です。市民が日常的に自然と触れ合える環境は、自然への理解と愛着を育み、保全活動の原動力となります。アーバンネイチャー北九州は、この「身近な自然」を核に、都市と自然が共生するモデルを推進しています。
    loops:
      - cpt: spot
        order: menu_order
        count: -1
        repeat: 1
        item_fields:
          - hero_image
          - hero_title
          - hero_lead
