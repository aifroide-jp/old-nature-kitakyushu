  - id: about_spots_hiraodai
    title: 平尾台 | アーバンネイチャー北九州
    file: about/spots/hiraodai.html
    page_type: single
    cpt: spot
    css:
      - https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap
      - css/base.css
      - css/page/spot.css
    sections:
      - id: hero
        fields:
          - field_name: hero_image
            type: image
            default: images/2026/04/soraland-hero.png
            alt: 平尾台カルスト台地の羊群原と青空の風景
          - field_name: hero_title
            type: text
            default: 平尾台
          - field_name: hero_lead
            type: textarea
            default: 羊の群れのような石灰岩が点在する、九州最大のカルスト台地
          - field_name: tag_1
            type: text
            default: '#小倉南区'
          - field_name: tag_2
            type: text
            default: '#山・カルスト'
          - field_name: tag_3
            type: text
            default: '#鍾乳洞'
          - field_name: tag_4
            type: text
            default: '#ハイキング'
      - id: detail
        fields:
          - field_name: overview_title
            type: text
            default: 見どころ・体験できること
          - field_name: overview_body
            type: wysiwyg
            default: >-
              <p>標高300〜700m、南北6kmに広がる九州最大のカルスト台地。白い石灰岩が草原のなかに点々と並ぶ「羊群原」の風景は、日本国内でも他に類を見ない絶景です。国指定特別天然記念物の「千仏鍾乳洞」では、洞内を流れる清水のなかを歩いて進む体験が大人気。</p>
                            <p>毎年3月の野焼きのあと萌え出る緑、秋に輝くすすき野原と、季節ごとの表情の変化も魅力です。カルスト地形に固有の草原生態系には希少な動植物が生息しており、平尾台自然観察センター（無料）では生き物の解説や観察プログラムも受けられます。</p>
          - field_name: season_title
            type: text
            default: 🗓 おすすめシーズン
          - field_name: season_body
            type: wysiwyg
            default: |-
              <strong>3月（野焼き）</strong>：壮大な炎と煙の光景<br>
                              <strong>4〜5月</strong>：野焼き後の新緑・春の花<br>
                              <strong>10〜11月</strong>：黄金色に輝くすすき野原
          - field_name: related_note
            type: wysiwyg
            default:
              __php: >-
                '平尾台のカルスト草原生態系が持つ生物多様性の価値については <a href="' . esc_url( nkk_get_page_permalink( 'about_biodiversity' ) ) .
                '">生物多様性とは？</a>'
          - field_name: info_title
            type: text
            default: 📍 基本情報・アクセス
          - field_name: address
            type: text
            default: 〒803-0180 福岡県北九州市小倉南区平尾台1-4-40
          - field_name: center_hours
            type: text
            default: 無料　9:00〜17:00　月曜休館
          - field_name: cave_fee
            type: text
            default: 大人900円・中学生600円・小学生500円・幼児200円　9:00〜17:00（土日祝〜18:00）
          - field_name: access_car
            type: text
            default: 北九州都市高速・横代出口より約25分
          - field_name: access_transit
            type: text
            default: JR石原駅よりタクシー約15分（公共バスは限定的）
          - field_name: parking
            type: text
            default: 市営駐車場：普通車300円/日・大型車1,000円/日（1,100台規模）
          - field_name: official_label
            type: text
            default: 平尾台自然観察センター
          - field_name: official_url
            type: url
            default: ''
          - field_name: map_title
            type: text
            default: 地図・場所
          - field_name: map_src
            type: url
            default: https://maps.google.com/maps?q=平尾台自然観察センター+北九州市&output=embed&hl=ja
