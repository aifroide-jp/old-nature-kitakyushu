            type: textarea
            default: >-
              地球上には推定870万種の生物が暮らし、互いに複雑なネットワークで結ばれています。しかし今、人類の活動によって種の絶滅が加速し、「第6の大量絶滅」が進行中と指摘されています。現在の絶滅スピードは、自然状態の<strong>約100〜1,000倍</strong>に達すると言われています。
          - field_name: stat_number_1
            type: text
            default: '73'
          - field_name: stat_unit_1
            type: textarea
            default: '%'
          - field_name: stat_label_1
            type: text
            default: 過去50年間で野生生物の個体群が減少した割合（WWF 2024）
          - field_name: stat_number_2
            type: text
            default: '100'
          - field_name: stat_unit_2
            type: textarea
            default: 万種
          - field_name: stat_label_2
            type: text
            default: 絶滅の危機に瀕している動植物の推定種数
          - field_name: stat_number_3
            type: text
            default: '35'
          - field_name: stat_unit_3
            type: textarea
            default: '%'
          - field_name: stat_label_3
            type: text
            default: 世界の農作物のうちハチなど花粉媒介生物に依存する割合（年間市場価値約577兆円）
          - field_name: diversity_title
            type: text
            default: 3つの多様性
          - field_name: diversity_lead
            type: textarea
            default: 生物多様性は、大きく3つのレベルで捉えられます。
          - field_name: diversity_icon_1
            type: text
            default: 🌎
          - field_name: diversity_name_1
            type: text
            default: 生態系の多様性
          - field_name: diversity_desc_1
            type: text
            default: 森林、湿地、干潟、サンゴ礁、河川など、さまざまなタイプの生態系が存在すること。
          - field_name: diversity_icon_2
            type: text
            default: 🐦
          - field_name: diversity_name_2
            type: text
            default: 種の多様性
          - field_name: diversity_desc_2
            type: text
            default: 動物、植物、菌類、微生物など、さまざまな種の生物が存在すること。
          - field_name: diversity_icon_3
            type: text
            default: 🧬
          - field_name: diversity_name_3
            type: text
            default: 遺伝子の多様性
          - field_name: diversity_desc_3
            type: text
            default: 同じ種の中でも個体ごとに異なる遺伝子を持ち、環境変化への適応力を保つこと。
          - field_name: keystone_title
            type: text
            default: 生き物のつながり：キーストーン種
          - field_name: keystone_body
            type: textarea
            default: >-
              生態系は複雑な「つながり」で成り立っており、特定の種が消えると連鎖的に崩壊することがあります。生態学者ロバート・ペインが行ったヒトデの除去実験では、ヒトデを取り除いただけで岩場の生き物が<strong>15種から8種</strong>に激減しました。こうした生態系を支えるカギとなる種を「キーストーン種」と呼びます。
      - id: services
        fields:
          - field_name: services_title
            type: text
            default: 生態系サービス
          - field_name: services_lead
            type: textarea
            default: 私たちの暮らしは、生態系が提供するさまざまな恵み（生態系サービス）に支えられています。これらのサービスは4つのカテゴリに分類されます。
          - field_name: service_icon_1
            type: text
            default: 🌱
          - field_name: service_name_1
            type: text
            default: 基盤サービス
          - field_name: service_desc_1
            type: text
            default: 他のすべてのサービスの基盤となる、生態系の根幹的な機能。
          - field_name: service_icon_2
            type: text
            default: 🍚
          - field_name: service_name_2
            type: text
            default: 供給サービス
          - field_name: service_desc_2
            type: text
            default: 食料、水、木材など、自然から直接得られる資源の提供。
          - field_name: service_icon_3
            type: text
            default: 🎨
          - field_name: service_name_3
            type: text
            default: 文化的サービス
          - field_name: service_desc_3
            type: text
            default: レクリエーション、精神的・文化的な豊かさなど、非物質的な恩恵。
          - field_name: service_icon_4
            type: text
            default: 🌡️
          - field_name: service_name_4
            type: text
            default: 調整サービス
          - field_name: service_desc_4
            type: text
            default: 環境を調節し、自然災害や気候変動の影響を緩和する機能。
      - id: trends
        fields:
          - field_name: trends_title
            type: text
            default: 国内外の動向
          - field_name: trends_lead
            type: textarea
            default: 生物多様性の保全に向けて、国際社会と日本では大きな制度・目標の枠組みが動き出しています。
          - field_name: framework_icon_1
            type: text
            default: 🌎
          - field_name: framework_name_1
            type: text
            default: プラネタリーバウンダリー
          - field_name: framework_desc_1
            type: text
            default: >-
              人類が地球上で安全に活動できる限界を示す9つの要素。気候変動・生物多様性・土地利用など9分野で「超えてはならない限界値」を定義したもので、すでに<strong>6つの要素が限界値を超過</strong>していると報告されています。生物多様性の危機は、気候変動と並ぶ地球規模の緊急課題です。
          - field_name: framework_icon_2
            type: text
            default: 🌎
          - field_name: framework_name_2
            type: text
            default: 昆明・モントリオール生物多様性枠組（GBF）
          - field_name: framework_desc_2
            type: text
            default: >-
              2022年12月にカナダ・モントリオール開催のCOP15で採択。2030年までの23のグローバルターゲットを設定し、生物多様性の損失を止めて回復軌道に乗せることを目指す。「ネイチャーポジティブ」の国際的根拠となる枠組み。
          - field_name: framework_icon_3
            type: text
            default: 📍
          - field_name: framework_name_3
            type: text
            default: 30by30目標
          - field_name: framework_desc_3
            type: text
            default: >-
              2030年までに陸域と海域のそれぞれ30%以上を効果的に保全する目標。日本の現状は陸域<strong>20.5%、海域13.3%</strong>（2021年時点）。保護区だけでなく、企業の緑地や里山など「OECM」の活用拡大が達成の鍵となる。
          - field_name: framework_icon_4
            type: text
            default: 🇯🇵
          - field_name: framework_name_4
            type: text
            default: 生物多様性国家戦略 2023-2030
          - field_name: framework_desc_4
            type: text
            default: 2023年3月閣議決定。「2030年ネイチャーポジティブ」を掲げ、自治体・企業・市民の連携による取り組みを推進。地域戦略の策定を各自治体に促している。
          - field_name: framework_icon_5
            type: text
            default: 📑
          - field_name: framework_name_5
            type: text
            default: 生物多様性増進活動促進法（2024年）
          - field_name: framework_desc_5
            type: text
            default: 2024年4月に成立・公布。企業や団体が自発的に生物多様性の保全・回復に取り組む活動を国が認定・支援する仕組みを整備。民間主体のネイチャーポジティブ行動を法律面から後押しする。
          - field_name: framework_icon_6
            type: text
            default: 📚
          - field_name: framework_name_6
            type: text
            default: OECM（保護地域以外で生物多様性保全に貢献するエリア）
          - field_name: framework_desc_6
            type: text
            default: 保護区以外の場所で生物多様性の保全に貢献しているエリアを認定する仕組み。企業の社有林、都市公園、里山、学校の緑地など多様な場所が対象。北九州でも登録が進む。
      - id: issues
        fields:
          - field_name: issues_title
            type: text
            default: 北九州市の課題
          - field_name: issues_lead
            type: textarea
            default: 豊かな自然を有する北九州市にも、生物多様性に関するさまざまな課題があります。
          - field_name: challenge_name_1
            type: text
            default: 洞海湾の環境回復（継続中）
          - field_name: challenge_desc_1
            type: text
            default: >-
              かつて「死の海」と呼ばれた洞海湾は、公害克服の取り組みにより水質が大幅に改善し、現在は<strong>100種を超える魚介類</strong>が確認されるまでに回復。一方、底質の改善や生態系の完全な回復には継続的なモニタリングと再生活動が必要です。
          - field_name: challenge_name_2
            type: text
            default: 放置竹林の拡大
          - field_name: challenge_desc_2
            type: text
            default: 高齢化や担い手不足により管理されなくなった竹林が周辺の里山や農地へ侵食。竹は繁殖力が強く、在来の植生を押しのけて生態系を均質化させます。合馬地区などでの管理継続が重要です。
          - field_name: challenge_name_3
            type: text
            default: 外来種の侵入と拡大
          - field_name: challenge_desc_3
            type: text
            default: アライグマ、ヌートリア、オオキンケイギクなどの外来種が在来の生態系を脅かしています。早期発見と適切な管理が地域の生物多様性を守る鍵です。
          - field_name: challenge_name_4
            type: text
            default: 磯焼け・海の環境変化
          - field_name: challenge_desc_4
            type: text
            default: 海水温の上昇に伴う磯焼け（藻場の衰退）が進行し、魚介類の生息環境が悪化。沿岸の生態系バランスを維持するための対策が急務です。
