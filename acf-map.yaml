          - field_name: about_body
            type: wysiwyg
            default: |-
              <p>北九州市響灘ビオトープは、約41ヘクタールの日本最大級のビオトープです。かつての廃棄物処分場跡地に自然が再生し、湿地、草原、淡水池など多様な環境が形成されています。</p>
                          <p>園内では絶滅危惧種を含む多くの動植物が確認されており、特にトンボ類や野鳥の種類が豊富です。自然観察路を歩きながら、季節ごとに異なる生き物たちとの出会いを楽しむことができます。</p>
                          <p>環境再生のモデルケースとして国内外から注目されており、自然の復元力を実感できる貴重な場所です。ガイド付きの自然観察会も定期的に開催されています。</p>
